name: KD Study Platform CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type Check (Shared)
      run: npx tsc --noEmit --project packages/shared/tsconfig.json

    - name: Type Check (DB)
      run: npx tsc --noEmit --project packages/db/tsconfig.json

    - name: Type Check (User API)
      run: npx tsc --noEmit --project server-user/tsconfig.json

    - name: Type Check (Admin API)
      run: npx tsc --noEmit --project server-admin/tsconfig.json

    - name: Type Check (Institute API)
      run: npx tsc --noEmit --project server-institute/tsconfig.json
