name: Deploy Backend to Oracle Cloud

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'server-user/**'
      - 'server-admin/**'
      - 'server-institute/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.user'
      - 'Dockerfile.admin'
      - 'Dockerfile.institute'
      - 'deploy/docker-compose.instance1.yml'
      - 'deploy/docker-compose.instance2.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_USER:      quanti-pi-dev/quanti-dev/user-api
  IMAGE_NAME_ADMIN:     quanti-pi-dev/quanti-dev/admin-api
  IMAGE_NAME_INSTITUTE: quanti-pi-dev/quanti-dev/institute-api

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push User API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.user
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_USER }}:latest
          cache-from: type=gha,scope=user-api
          cache-to:   type=gha,scope=user-api,mode=max

      - name: Build and push Admin API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.admin
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_ADMIN }}:latest
          cache-from: type=gha,scope=admin-api
          cache-to:   type=gha,scope=admin-api,mode=max

      - name: Build and push Institute API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.institute
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_INSTITUTE }}:latest
          cache-from: type=gha,scope=institute-api
          cache-to:   type=gha,scope=institute-api,mode=max

  deploy-user-api:
    needs: build-and-push-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to User VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.OCI_HOST_USER }}
          username: ${{ secrets.OCI_USERNAME }}
          key:      ${{ secrets.OCI_SSH_KEY_USER }}
          source:   "deploy/docker-compose.instance1.yml"
          target:   "quanti-pi"

      - name: Deploy User API via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.OCI_HOST_USER }}
          username: ${{ secrets.OCI_USERNAME }}
          key:      ${{ secrets.OCI_SSH_KEY_USER }}
          envs: GHCR_PAT,GHCR_ACTOR
          script: |
            cd ~/quanti-pi

            # Authenticate with GHCR using a dedicated PAT
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # Pull and start ONLY the user-api
            docker compose -f docker-compose.instance1.yml pull user-api
            docker compose -f docker-compose.instance1.yml up -d --remove-orphans user-api

            # Prune dangling images to recover disk space
            docker image prune -af
        env:
          GHCR_PAT:   ${{ secrets.GHCR_PAT }}
          GHCR_ACTOR: ${{ github.actor }}

  deploy-admin-institute-api:
    needs: build-and-push-images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to Admin/Institute VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.OCI_HOST_ADMIN }}
          username: ${{ secrets.OCI_USERNAME }}
          key:      ${{ secrets.OCI_SSH_KEY_ADMIN }}
          source:   "deploy/docker-compose.instance2.yml"
          target:   "quanti-pi"

      - name: Deploy Admin & Institute APIs via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.OCI_HOST_ADMIN }}
          username: ${{ secrets.OCI_USERNAME }}
          key:      ${{ secrets.OCI_SSH_KEY_ADMIN }}
          envs: GHCR_PAT,GHCR_ACTOR
          script: |
            cd ~/quanti-pi

            # Authenticate with GHCR using a dedicated PAT
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # Pull and start admin-api, institute-api, and self-hosted redis
            docker compose -f docker-compose.instance2.yml pull admin-api institute-api redis
            docker compose -f docker-compose.instance2.yml up -d --remove-orphans admin-api institute-api redis

            # Prune dangling images to recover disk space
            docker image prune -af
        env:
          GHCR_PAT:   ${{ secrets.GHCR_PAT }}
          GHCR_ACTOR: ${{ github.actor }}
