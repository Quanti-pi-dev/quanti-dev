# ============================================================
# Docker Compose — Development Environment
# Study Platform: PostgreSQL + MongoDB + Redis
#                 + User API (port 3000)
#                 + Admin API (port 3001)
# ============================================================

services:
  # ─── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kd_study}
      POSTGRES_USER: ${POSTGRES_USER:-kd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kd_secret_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NOTE: Do NOT mount migrations here. The migration runner (migrate.ts)
      # handles schema changes and tracks them in schema_migrations.
      # Mounting into /docker-entrypoint-initdb.d causes a double-apply crash.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kd_user} -d ${POSTGRES_DB:-kd_study}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MongoDB ─────────────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: kd-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-kd_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-kd_secret_dev}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-kd_content}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: kd-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Common env anchor ───────────────────────────────────
  # Shared environment variables injected into both API services.
  # x-api-env is a YAML anchor — not a Docker service.
  x-api-env: &api-env
    NODE_ENV: development
    LOG_LEVEL: debug
    POSTGRES_URL: postgresql://${POSTGRES_USER:-kd_user}:${POSTGRES_PASSWORD:-kd_secret_dev}@postgres:5432/${POSTGRES_DB:-kd_study}
    MONGO_URL: mongodb://${MONGO_USER:-kd_user}:${MONGO_PASSWORD:-kd_secret_dev}@mongo:27017/${MONGO_DB:-kd_content}?authSource=admin
    REDIS_URL: redis://redis:6379
    FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
    FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
    RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
    RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    R2_ENDPOINT: ${R2_ENDPOINT:-}
    R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
    R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    R2_BUCKET: ${R2_BUCKET:-}
    CDN_BASE_URL: ${CDN_BASE_URL:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-}
    NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}

  # ─── User API (port 3000) ───────────────────────────────
  # Student-facing routes + all cron jobs.
  api-user:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.server-user
    container_name: kd-api-user
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
    ports:
      - "${USER_API_PORT:-3000}:3000"
    volumes:
      - ../../server-user/src:/app/server-user/src:ro
      - ../../packages:/app/packages:ro

  # ─── Admin API (port 3001) ──────────────────────────────
  # Admin-only routes. Stateless — no cron jobs.
  # Rejects all non-admin tokens at the auth plugin level.
  api-admin:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.server-admin
    container_name: kd-api-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      HOST: 0.0.0.0
      PORT: 3001
      ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN:-http://localhost:3002}
    ports:
      - "${ADMIN_API_PORT:-3001}:3001"
    volumes:
      - ../../server-admin/src:/app/server-admin/src:ro
      - ../../packages:/app/packages:ro

  # ─── Legacy Monolith (port 3099) — for reference during cutover ──
  # Keep running until server-user + server-admin are fully validated.
  # Remove once cutover is complete.
  api-legacy:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.dev
    container_name: kd-api-legacy
    restart: "no"
    profiles: ["legacy"]     # Only starts with: docker compose --profile legacy up
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      HOST: 0.0.0.0
      PORT: 3099
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
    ports:
      - "3099:3099"
    volumes:
      - ../../server/src:/app/server/src:ro
      - ../../packages:/app/packages:ro

volumes:
  postgres_data:
  mongo_data:
  redis_data:
